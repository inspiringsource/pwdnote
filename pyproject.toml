[project]
name = "pwdnote"
version = "0.1.1"
description = "Encrypted, project-local notes for your terminal."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "pwdnote maintainers" }]
keywords = ["notes", "encryption", "cli", "terminal", "project"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "cryptography>=42.0",
]

[project.urls]
Homepage = "https://https://github.com/inspiringsource/pwdnote"
Repository = "https://https://github.com/inspiringsource/pwdnote"
Issues = "https://https://github.com/inspiringsource/pwdnote/issues"

[project.scripts]
pwdnote = "pwdnote.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pwdnote"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["pwdnote"]
