name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish

      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          repository: inspiringsource/inspiringsource.github.io
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: website

      - name: Update website page
        run: uv run python scripts/update_website.py --website-file website/pwdnote/index.html

      - name: Commit and push website changes
        working-directory: website
        run: |
          if git diff --quiet -- pwdnote/index.html; then
            echo "No website changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pwdnote/index.html
          git commit -m "Update pwdnote website release"
          git push
